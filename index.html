<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>Slingshot Siege</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        overflow: hidden;
        height: 100svh;
        width: 100vw;
        background-color: #222;
      }

      #stage {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #stage > canvas {
        position: absolute;
      }

      #pause {
        position: absolute;
        top:10px;
        left: 10px;
        aspect-ratio: 1;
        background: rgba(136, 136, 136, 0.5);
        color: white;
        outline: none;
        border: 2px solid #444;
        font-size: 16px;
        font-weight: 900;
        padding: 5px;
        z-index: 999;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <button id="pause" hidden>||</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
